{% extends "base.html" %}

{% block content %}
    <div class="mb-6">
        <a href="{{ url_for('bug_detail', bug_id=bug.id) }}" class="text-blue-600 hover:underline text-sm">&larr; Back to bug</a>
        <h2 class="text-xl font-semibold mt-2">Edit Bug #{{ bug.id }}</h2>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" action="{{ url_for('edit_bug', bug_id=bug.id) }}">
            <div class="mb-4">
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    required
                    value="{{ title or bug.title }}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="Brief summary of the bug"
                />
            </div>

            <div class="mb-4">
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="Steps to reproduce, expected vs actual behaviour..."
                >{{ description if description is defined else bug.description or '' }}</textarea>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select
                        id="status"
                        name="status"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                        <option value="open" {{ 'selected' if (status or bug.status) == 'open' else '' }}>Open</option>
                        <option value="in-progress" {{ 'selected' if (status or bug.status) == 'in-progress' else '' }}>In Progress</option>
                        <option value="closed" {{ 'selected' if (status or bug.status) == 'closed' else '' }}>Closed</option>
                    </select>
                </div>

                <div>
                    <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                    <select
                        id="priority"
                        name="priority"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                        <option value="low" {{ 'selected' if (priority or bug.priority) == 'low' else '' }}>Low</option>
                        <option value="medium" {{ 'selected' if (priority or bug.priority) == 'medium' else '' }}>Medium</option>
                        <option value="high" {{ 'selected' if (priority or bug.priority) == 'high' else '' }}>High</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3">
                <button
                    type="submit"
                    class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition"
                >
                    Save Changes
                </button>
                <a
                    href="{{ url_for('bug_detail', bug_id=bug.id) }}"
                    class="bg-gray-200 text-gray-700 px-6 py-2 rounded hover:bg-gray-300 transition"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
