{% extends "base.html" %}

{% block content %}
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-semibold">All Bugs</h2>
        <a href="/new" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
            + New Bug
        </a>
    </div>

    {% if bugs %}
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="text-left px-6 py-3 text-sm font-medium text-gray-500">Title</th>
                        <th class="text-left px-6 py-3 text-sm font-medium text-gray-500">Status</th>
                        <th class="text-left px-6 py-3 text-sm font-medium text-gray-500">Priority</th>
                        <th class="text-left px-6 py-3 text-sm font-medium text-gray-500">Created</th>
                    </tr>
                </thead>
                <tbody>
                    {% for bug in bugs %}
                        <tr class="border-b last:border-0 hover:bg-gray-50">
                            <td class="px-6 py-4">
                                <a href="/bug/{{ bug.id }}" class="text-blue-600 hover:underline font-medium">
                                    {{ bug.title }}
                                </a>
                            </td>
                            <td class="px-6 py-4">
                                <span class="inline-block px-2 py-1 text-xs font-medium rounded
                                    {% if bug.status == 'open' %}bg-green-100 text-green-700
                                    {% elif bug.status == 'in-progress' %}bg-yellow-100 text-yellow-700
                                    {% else %}bg-gray-100 text-gray-700{% endif %}">
                                    {{ bug.status }}
                                </span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="inline-block px-2 py-1 text-xs font-medium rounded
                                    {% if bug.priority == 'high' %}bg-red-100 text-red-700
                                    {% elif bug.priority == 'medium' %}bg-yellow-100 text-yellow-700
                                    {% else %}bg-blue-100 text-blue-700{% endif %}">
                                    {{ bug.priority }}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-500">
                                {{ bug.created_at[:10] }}
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <div class="bg-white rounded-lg shadow p-8 text-center">
            <p class="text-gray-500">No bugs yet. Create your first one!</p>
        </div>
    {% endif %}
{% endblock %}
